<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BEN · Vollendung (9) · Positiv-Axiom</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:20px; }
pre { background:#111; padding:10px; border-left:3px solid #0f0; }
button { background:#0f0; color:#000; padding:10px 20px; border:none; cursor:pointer; }
</style>
</head>

<body>

<h1>BEN · Vollendung (9) · Positiv-Axiom</h1>

<button onclick="RUN_BEN()">BEN START</button>

<pre id="out">BEN wartet…</pre>

<script type="module">

import { BEN_AXIOM } from "./NegativAxiom.js";   // wird gleich ersetzt
import { BEN_PREFETCH } from "./Prefetch.js";
import { BEN_LOAD_LOGIC } from "./ECO.js";
import { BEN_GHOST } from "./ghost.html";
import { BEN_VERIFY } from "./verify.html";
import { BEN_ECO } from "./ECO.js";

async function RUN_BEN() {

    const pre = await BEN_PREFETCH();
    const logic = await BEN_LOAD_LOGIC();

    const ghost = BEN_GHOST(pre);
    const verify = BEN_VERIFY(pre.alt.tmpDA, pre.alt.tmpNE, pre.alt.tmpBEN);

    const eco = BEN_ECO(pre, logic);

    const out = {
        axiome: BEN_AXIOM,
        prefetch: pre,
        logic,
        ghost,
        verify,
        eco,
        state: "BEN-READY"
    };

    document.getElementById("out").innerText =
        JSON.stringify(out, null, 2);
}

</script>

</body>
</html>
